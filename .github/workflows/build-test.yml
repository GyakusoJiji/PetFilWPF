# Builds and tests the WPF port of PetFil, and packages the Windows executable.

name: Build and Test

on:
  push:
  pull_request:
  release:
    types:
      - published

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build_test:
    name: Build and unit test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore PetFil.sln

      - name: Build
        run: dotnet build PetFil.sln --configuration Release --no-restore

      - name: Perform unit tests
        run: >
          dotnet test PetFil.Wpf.Tests/PetFil.Wpf.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  publish:
    name: Publish ${{ matrix.runtime }}
    needs: [build_test]
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Determine package name
        run: |
          $version = if ('${{ github.event_name }}' -eq 'release') { '${{ github.ref_name }}' } else { 'nightly' }
          "PACKAGE_NAME=PetFil-$version-${{ matrix.runtime }}" >> $env:GITHUB_ENV

      - name: Publish self-contained executable
        run: >
          dotnet publish PetFil.Wpf/PetFil.Wpf.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          -p:PublishSingleFile=true
          --output publish/${{ matrix.runtime }}

      - name: Copy README
        run: Copy-Item README.md publish/${{ matrix.runtime }}/

      - name: Upload artifacts for inspection
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: publish/${{ matrix.runtime }}

      - name: Upload assets to release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path "publish/${{ matrix.runtime }}/*" -DestinationPath "$env:PACKAGE_NAME.zip"
          gh release upload "${{ github.ref_name }}" "$env:PACKAGE_NAME.zip" --clobber
